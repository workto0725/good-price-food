<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한끼발견 실행 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef9f6;color:#202622}
main{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{width:min(100%,420px);background:#fff;border-radius:28px;padding:38px 24px;text-align:center;box-shadow:0 12px 35px #24483a18}
.logo{font-size:34px;font-weight:900;margin-bottom:22px}.rice{font-size:30px}
.ok{width:68px;height:68px;margin:0 auto 20px;border-radius:50%;background:#18a37b;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900}
h1{font-size:22px;margin:0 0 10px}p{color:#6c7772;line-height:1.6;margin:0 0 25px}
button{width:100%;border:0;border-radius:16px;padding:15px;background:#18a37b;color:#fff;font-size:16px;font-weight:900}
#done{display:none;margin-top:18px;padding:13px;border-radius:14px;background:#fff7df;color:#735b22;font-weight:800}
</style>
</head>
<body>
<main><section class="card">
<div class="logo">한끼발견 <span class="rice">🍚</span></div>
<div class="ok">✓</div>
<h1>사이트 정상 실행 테스트</h1>
<p>이 화면이 보이면 GitHub Pages와<br>새 index.html은 정상입니다.</p>
<button id="test">홈 화면으로 들어가기</button>
<div id="done">버튼도 정상적으로 작동합니다.</div>
</section></main>
<script>
document.getElementById("test").addEventListener("click",function(){
 document.getElementById("done").style.display="block";
});
</script>
</body></html>
