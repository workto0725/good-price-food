function drawRows(rows){B.innerHTML=rows.length?rows.map((x,i)=>'<div class="v41Item" data-i="'+i+'"><b>'+x.place_name+'</b><div>'+(x.road_address_name||x.address_name||'')+'</div><small>'+(x.d==null?'':Math.round(x.d)+'m')+'</small></div>').join(''):'<div class="v41Item">검색 결과가 없어요.</div>';B.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{let x=rows[+el.dataset.i];T.textContent=x.place_name;B.innerHTML='<div class="v41Item"><b>'+x.place_name+'</b><p>'+(x.road_address_name||x.address_name||'')+'</p><small>'+(x.d==null?'':Math.round(x.d)+'m')+'</small></div>'})}
async function nearby(title='📍 내 주변 식당'){open(title);S.textContent='위치를 확인하고 있어요…';try{let [la,lo]=await getLocation();S.textContent='주변 식당을 찾고 있어요…';ps.categorySearch('FD6',(a,st)=>{if(st===kakao.maps.services.Status.OK){places=a.map(x=>({...x,d:D(la,lo,+x.y,+x.x)}));S.textContent='현재 위치 기준 가까운 식당이에요.';drawRows(places)}else S.textContent='주변 식당을 찾지 못했어요.'},{location:new kakao.maps.LatLng(la,lo),radius:2000,sort:kakao.maps.services.SortBy.DISTANCE,size:15})}catch(e){S.textContent='위치 권한 또는 카카오 지도 설정을 확인해주세요.'}}
async function category(label,q){open(label);S.textContent='식당을 찾고 있어요…';try{let [la,lo]=await getLocation();ps.keywordSearch(q,(a,st)=>{if(st===kakao.maps.services.Status.OK){let r=a.map(x=>({...x,d:D(la,lo,+x.y,+x.x)})).sort((a,b)=>a.d-b.d);S.textContent='현재 위치에서 가까운 '+label+' 식당이에요.';drawRows(r)}else S.textContent='검색 결과가 없어요.'},{location:new kakao.maps.LatLng(la,lo),radius:5000,size:15})}catch(e){S.textContent='위치 권한 또는 카카오 지도 설정을 확인해주세요.'}}
function localOff(){open('✨ 지도 밖 식당');let a=[];try{a=JSON.parse(localStorage.getItem('hankkiOffMap')||'[]')}catch(e){};B.innerHTML=a.length?a.map(x=>'<div class="v41Item"><b>'+x.name+'</b><div>'+x.price+'</div></div>').join(''):'<div class="v41Item">아직 등록된 지도 밖 식당이 없어요.</div>'}

document.querySelectorAll('.v41hot').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();let a=b.dataset.act;
 if(['한식','분식','고기','치킨','피자','햄버거','카페'].includes(a))return category(a==='카페'?'카페/디저트':a,a);
 if(a==='near'||a==='filterNear')return nearby();
 if(a==='킹성비'||a==='kingBanner')return category('👑 킹성비','맛집');
 if(a==='filterPopular')return nearby('🔥 인기순');
 if(a==='filterNew')return nearby('🆕 최신순');
 if(a==='filterDiscount')return nearby('🏷️ 할인중');
 if(a==='filterOff'||a==='OFF')return localOff();
 if(a==='AI'){open('🤖 AI 한끼');B.innerHTML='<button class="mode" onclick="document.getElementById(\\'v41Page\\').style.display=\\'none\\';document.getElementById(\\'aiMode\\').style.display=\\'block\\';document.getElementById(\\'home\\').style.display=\\'none\\'">AI 한끼 시작하기</button>';return}
 if(a==='OWNER'){open('📣 사장님 소식');B.innerHTML='<div class="v41Item">등록된 사장님 소식이 표시됩니다.</div>';return}
 if(a==='MORE'){open('더보기');B.innerHTML='<div class="v41Item">추가 카테고리를 준비 중이에요.</div>';return}
 if(a==='location'){open('📍 지역 설정');B.innerHTML='<button class="mode" id="v41loc">현재 위치 사용</button>';document.getElementById('v41loc').onclick=()=>nearby();return}
 if(a==='searchTop'||a==='searchBar'){open('🔎 검색');B.innerHTML='<input id="v41q" class="field" placeholder="지역, 식당명, 메뉴 검색"><button id="v41go" class="mode">검색</button>';document.getElementById('v41go').onclick=()=>category('검색 결과',document.getElementById('v41q').value);return}
 if(a==='bell'){open('🔔 알림');B.innerHTML='<div class="v41Item">아직 새로운 알림이 없어요.</div>';return}
 if(a==='myTop'){open('마이');B.innerHTML='<div class="v41Item">내 발견과 찜한 식당을 관리하는 화면입니다.</div>';return}
 if(a.startsWith('card')){let n=+a.replace('card','')-1;if(places[n]){open(places[n].place_name);drawRows([places[n]])}else nearby();return}
});

const nav=document.getElementById('v40Nav');
nav.querySelector('[data-nav="home"]').onclick=()=>window.scrollTo(0,0);
nav.querySelector('[data-nav="field"]').onclick=()=>nearby('⌖ 현장발견');
nav.querySelector('[data-nav="discover"]').onclick=()=>{open('＋ 발견하기');B.innerHTML='<button class="mode" id="v41mapped">📍 지도에 있는 식당</button><button class="mode" id="v41off">✨ 지도에 없는 식당</button>';document.getElementById('v41mapped').onclick=()=>nearby('📍 현장발견');document.getElementById('v41off').onclick=localOff};
nav.querySelector('[data-nav="map"]').onclick=()=>{open('🗺️ 지도');B.innerHTML='<div class="v41Item">카카오 지도 화면을 불러오는 중입니다.</div>';const old=document.getElementById('navMap');if(old)old.click()};
nav.querySelector('[data-nav="my"]').onclick=()=>{open('마이');B.innerHTML='<div class="v41Item">내 발견과 찜한 식당을 관리하는 화면입니다.</div>'};
})();
</script></body></html>
