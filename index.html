sition:absolute;right:0;top:0;width:34%;height:14%;border:0;background:transparent}.next{position:absolute;left:4%;bottom:1%;width:92%;height:13%;border:0;background:transparent}

<section id="screen" class="screen"><div class="inner"><header class="head"><button id="back" class="back"><svg viewBox="0 0 24 24"><path d="M15.5 5.5 9 12l6.5 6.5"/></svg></button><h2 id="title"></h2></header><div id="body"></div></div></section>
<section id="onboard" class="onboard"><div class="phone"><div class="slide active"><img src="onboarding_1.webp"></div><div class="slide"><img src="onboarding_2.webp"></div><div class="slide"><img src="onboarding_3.webp"></div><button id="skip" class="skip"></button><button id="next" class="next"></button></div></section><script>
(function(){
const S=document.getElementById("screen"),T=document.getElementById("title"),B=document.getElementById("body");
function close(){S.style.display="none";document.body.style.overflow=""}
function open(n){T.textContent=n;S.style.display="block";document.body.style.overflow="hidden";B.innerHTML="";
if(n==="위치 설정"){B.innerHTML='<button class="choice" id="gps">현재 위치 사용</button><h3>지역·동네·장소 검색</h3><input id="li" class="field" placeholder="예: 일광읍, 광안리, 동성로"><button id="choose" class="choice">입력한 위치 선택</button><div id="picked"></div><button id="confirm" class="confirm">이 위치로 설정</button>';let p="";let input=document.getElementById("li");document.getElementById("gps").onclick=()=>{p="현재 위치";document.getElementById("picked").textContent="선택: "+p};document.getElementById("choose").onclick=()=>{p=input.value.trim();if(p)document.getElementById("picked").textContent="선택: "+p};document.getElementById("confirm").onclick=()=>{if(!p)return;localStorage.setItem("hankkiLoc",p);document.getElementById("loc").textContent="📍 "+p+"⌄";document.getElementById("region").textContent=p;close()};return}
if(n==="AI 한끼"){B.innerHTML='<button class="choice">지금 한 끼 추천</button><button class="choice">오늘 하루 식사 코스</button><button class="choice">여행지 먹거리 코스</button>';return}
if(n==="현장발견"){B.innerHTML='<p>직접 확인한 우리 동네 식당 정보를 나누는 곳이에요.</p><button class="choice">현재 위치 주변 식당에서 선택</button><button class="choice">지도에 없는 식당 발견</button>';return}
B.innerHTML='<p>'+n+' 화면으로 정상 이동했습니다.</p>'}
document.getElementById("back").onclick=close;document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>open(x.dataset.page));document.getElementById("loc").onclick=()=>open("위치 설정");
let sv=localStorage.getItem("hankkiLoc");if(sv){document.getElementById("loc").textContent="📍 "+sv+"⌄";document.getElementById("region").textContent=sv}
let i=0,ob=document.getElementById("onboard"),sl=[...document.querySelectorAll(".slide")];function paint(){sl.forEach((x,n)=>x.classList.toggle("active",n===i))}document.getElementById("skip").onclick=()=>ob.style.display="none";document.getElementById("next").onclick=()=>{if(i<2){i++;paint()}else ob.style.display="none"};paint();
})();
