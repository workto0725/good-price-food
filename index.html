<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>착한한끼 - 내 주변 가성비 맛집</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="loginScreen" class="screen login-screen">
      <div class="brand-mark">🍚</div>
      <h1>착한한끼</h1>
      <p class="sub">내 주변 가성비 좋은 식당을 빠르게 찾아보세요.</p>
      <div class="card login-card">
        <label>이메일</label>
        <input id="emailInput" type="email" placeholder="example@email.com" autocomplete="email" />
        <label>비밀번호</label>
        <input id="pwInput" type="password" placeholder="4자 이상" autocomplete="current-password" />
        <button id="loginBtn" class="primary">로그인 / 시작하기</button>
        <p class="hint">1차 MVP는 기기 내 로그인입니다. 실제 출시 시 Firebase·카카오 로그인으로 교체 가능합니다.</p>
      </div>
    </section>

    <section id="mainScreen" class="screen hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">내 주변 가성비 식당</div>
          <h2>오늘 어디서 먹을까요?</h2>
        </div>
        <button id="logoutBtn" class="icon-btn" title="로그아웃">↪</button>
      </header>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="식당명 또는 메뉴 검색" />
        <button id="locateBtn" class="locate-btn">📍 내 위치</button>
      </div>

      <div class="filters" id="filters">
        <button class="chip active" data-filter="all">전체</button>
        <button class="chip" data-filter="cheap">1만원 이하</button>
        <button class="chip" data-filter="open">지금 영업중</button>
        <button class="chip" data-filter="saved">찜</button>
      </div>

      <div class="content-grid">
        <div class="map-wrap">
          <div id="map"></div>
          <div id="mapStatus" class="map-status">위치를 확인하는 중…</div>
        </div>

        <aside class="list-panel">
          <div class="list-title-row">
            <strong id="resultCount">식당 0곳</strong>
            <select id="sortSelect" aria-label="정렬">
              <option value="distance">거리순</option>
              <option value="rating">가성비순</option>
              <option value="price">가격순</option>
            </select>
          </div>
          <div id="restaurantList" class="restaurant-list"></div>
        </aside>
      </div>
    </section>

    <div id="detailSheet" class="sheet hidden" aria-modal="true" role="dialog">
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet-card">
        <div class="sheet-handle"></div>
        <button id="closeSheet" class="close-btn">✕</button>
        <div id="detailContent"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
