<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한끼발견 실행 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef9f6;
      color: #202622;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 28px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(36, 72, 58, 0.12);
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 25px;
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #18a37b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    p {
      color: #6c7772;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      background: #18a37b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #fff6dc;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="card">

      <div class="logo">
        한끼발견 🍚
      </div>

      <div class="check">
        ✓
      </div>

      <h1>사이트 정상 실행 테스트</h1>

      <p>
        이 화면이 보이면<br>
        GitHub Pages와 index.html은 정상입니다.
      </p>

      <button id="testButton">
        버튼 작동 확인
      </button>

      <div id="result">
        버튼도 정상적으로 작동합니다!
      </div>

    </div>
  </div>

  <script>
    document.getElementById("testButton").addEventListener("click", function () {
      document.getElementById("result").style.display = "block";
    });
  </script>

</body>
</html>
