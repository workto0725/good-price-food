async function nearK(t='내 주변 식당'){openK(t);ST.textContent='현재 위치를 확인하고 있어요.';try{let[a,b]=await locateK();Kps.categorySearch('FD6',(r,st)=>{if(st===kakao.maps.services.Status.OK){let z=r.map(x=>({...x,_d:d(a,b,+x.y,+x.x)}));ST.textContent='현재 위치에서 가까운 식당이에요.';rows(z)}else ST.textContent='주변 식당을 찾지 못했어요.'},{location:new kakao.maps.LatLng(a,b),radius:2000,sort:kakao.maps.services.SortBy.DISTANCE,size:15})}catch(e){ST.textContent='위치 권한 또는 카카오 지도 설정을 확인해주세요.'}}
async function catK(t,q){openK(t);ST.textContent='식당을 찾고 있어요.';try{let[a,b]=await locateK();Kps.keywordSearch(q,(r,st)=>{if(st===kakao.maps.services.Status.OK){let z=r.map(x=>({...x,_d:d(a,b,+x.y,+x.x)})).sort((x,y)=>x._d-y._d);ST.textContent='현재 위치에서 가까운 결과예요.';rows(z)}else ST.textContent='검색 결과가 없어요.'},{location:new kakao.maps.LatLng(a,b),radius:5000,size:15})}catch(e){ST.textContent='위치 권한 또는 카카오 지도 설정을 확인해주세요.'}}
async function mapK(f){openK('지도');B.innerHTML='<div id="kmap" class="realMap"></div>';try{let[a,b]=await locateK();let center=f?new kakao.maps.LatLng(+f.y,+f.x):new kakao.maps.LatLng(a,b);let m=new kakao.maps.Map(document.getElementById('kmap'),{center,level:4});new kakao.maps.Marker({map:m,position:new kakao.maps.LatLng(a,b),title:'현재 위치'});(f?[f]:Kplaces).forEach(x=>new kakao.maps.Marker({map:m,position:new kakao.maps.LatLng(+x.y,+x.x),title:x.place_name}))}catch(e){ST.textContent='지도를 불러오지 못했어요.'}}
document.querySelectorAll('.cat[data-cat]').forEach(x=>x.onclick=()=>catK(x.dataset.cat,x.dataset.cat==='고기/구이'?'고기':x.dataset.cat.replace('/디저트','')));
document.querySelector('.near button').onclick=()=>nearK();
document.querySelector('[data-nav="field"]').onclick=()=>nearK('현장발견');
document.querySelector('[data-nav="map"]').onclick=()=>mapK();
document.querySelector('.hybridKing').onclick=()=>catK('킹성비','맛집');
})();

async function searchPlace(){let q=document.getElementById('placeQ').value.trim();if(!q)return;let out=document.getElementById('placeResults');out.innerHTML='검색 중…';try{await readyK();Kps.keywordSearch(q,(r,st)=>{if(st===kakao.maps.services.Status.OK){out.innerHTML=r.slice(0,8).map((x,i)=>'<button data-p="'+i+'"><b>'+x.place_name+'</b><br><small>'+(x.road_address_name||x.address_name||'')+'</small></button>').join('');out.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{let x=r[+el.dataset.p];A.placeName=x.place_name;A.placeLat=+x.y;A.placeLng=+x.x;A.i=0;draw()})}else out.innerHTML='검색 결과가 없어요.'})}catch(e){out.innerHTML='카카오 장소검색 연결을 확인해주세요.'}}
function draw(){let q=Q[A.i];show('AI 한끼');ST.innerHTML='<div class="aiProgress"><div style="width:'+((A.i+1)/Q.length*100)+'%"></div></div>';B.innerHTML='<h2>'+q[0]+'</h2><div class="aiChoices">'+q[2].map(v=>'<button class="aiChoice '+(A[q[1]]===v?'sel':'')+'" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="aiActions">'+(A.i?'<button id="aiPrev">이전</button>':'')+'<button id="aiNext" class="aiNext">'+(A.i===Q.length-1?'추천받기':'다음')+'</button></div>';B.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{A[q[1]]=x.dataset.v;draw()});let p=document.getElementById('aiPrev');if(p)p.onclick=()=>{A.i--;draw()};document.getElementById('aiNext').onclick=()=>{if(A.i<Q.length-1){A.i++;draw()}else result()}}

(function(){
let oi=0,ob=document.getElementById('onboarding'),steps=[...document.querySelectorAll('.obHtml')],dots=[...document.querySelectorAll('.obDots i')];
function paint(){steps.forEach((x,i)=>x.classList.toggle('active',i===oi));dots.forEach((x,i)=>x.classList.toggle('on',i===oi));document.getElementById('obNext').textContent=oi===2?'한끼발견 시작하기':'다음 ›'}
function closeOb(){ob.style.display='none';localStorage.setItem('hankkiOnboarded22','1')}
if(!localStorage.getItem('hankkiOnboarded22')){ob.style.display='block';paint()}
document.getElementById('obSkip').onclick=closeOb;document.getElementById('obNext').onclick=()=>{if(oi<2){oi++;paint()}else closeOb()};
document.querySelectorAll('[data-nav="favorite"]').forEach(b=>b.onclick=()=>{openK('찜한 식당');ST.textContent='저장해둔 식당을 모아보는 곳이에요.';B.innerHTML='<div class="realRow">아직 찜한 식당이 없어요.</div>'});
document.querySelectorAll('.conceptSig [data-nav="field"],.communityArt [data-nav="field"]').forEach(b=>b.onclick=()=>nearK('현장발견'));
})();
</script><section id="fieldReport" class="screen"><div class="screeninner">
<header class="screenhead"><button id="fieldBack">‹</button><h2>현장발견</h2></header>
<p class="fieldLead">직접 확인한 우리 동네 식당 정보를 알려주세요.</p>
<div id="fieldStep1">
<button class="mode" id="fieldNearby">현재 위치 주변 식당에서 선택</button>
<button class="mode" id="fieldOffMap">지도에 없는 식당 발견</button>
</div>
<div id="fieldForm" style="display:none">
<label class="fieldLabel">식당명</label><input id="fieldName" class="field" placeholder="식당 이름">
<label class="fieldLabel">무엇을 발견했나요?</label>
<div class="fieldTypes">
<button data-ft="가격·메뉴">가격·메뉴</button><button data-ft="점심특선">점심특선</button>
<button data-ft="할인">할인</button><button data-ft="영업시간·휴무">영업시간·휴무</button>

</div>

<button class="fieldSubmit" id="fieldSubmit">현장정보 등록하기</button>
</div></div></section><script>
(function(){
const FR=document.getElementById('fieldReport'), FF=document.getElementById('fieldForm');
function openField(){
 document.querySelectorAll('.screen').forEach(x=>x.style.display='none');
 FR.style.display='block';document.body.style.overflow='hidden';window.scrollTo(0,0);
}
function closeField(){FR.style.display='none';document.body.style.overflow=''}
document.getElementById('fieldBack').onclick=closeField;
const community=document.getElementById('communityField');
community.onclick=openField;community.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openField()}};
document.querySelectorAll('.conceptSig [data-nav="field"]').forEach(b=>b.onclick=openField);
document.querySelectorAll('.navPremium [data-nav="field"]').forEach(b=>b.onclick=openField);
document.querySelector('.communityArt button').onclick=e=>{e.stopPropagation();openField()};

document.getElementById('fieldNearby').onclick=()=>{FF.style.display='block';document.getElementById('fieldName').placeholder='주변 식당 이름을 선택하거나 입력';FF.scrollIntoView({behavior:'smooth'})};
document.getElementById('fieldOffMap').onclick=()=>{FF.style.display='block';document.getElementById('fieldName').placeholder='지도에 없는 식당 이름';FF.scrollIntoView({behavior:'smooth'})};
document.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ft]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
document.getElementById('fieldSubmit').onclick=()=>{
 let name=document.getElementById('fieldName').value.trim(),type=document.querySelector('[data-ft].on'),memo=document.getElementById('fieldMemo').value.trim();
 if(!name){alert('식당명을 입력해주세요.');return}if(!type){alert('발견한 정보 종류를 선택해주세요.');return}
 let a=[];try{a=JSON.parse(localStorage.getItem('hankkiFieldReports')||'[]')}catch(e){}
 a.unshift({name,type:type.dataset.ft,memo,date:new Date().toISOString()});localStorage.setItem('hankkiFieldReports',JSON.stringify(a));
 alert('현장정보가 등록되었습니다.');closeField();
};
})();
