<script>
const $=x=>document.getElementById(x);let ps,geo,lat=null,lng=null,places=[],flt='near',mode='지금 한 끼';
function go(id){document.querySelectorAll('.page').forEach(x=>x.style.display='none');$('home').style.display=id==='home'?'block':'none';document.querySelector('.nav').style.display=id==='home'?'grid':'none';if(id!=='home')$(id).style.display='block';scrollTo(0,0)}
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>go('home'));$('homeBtn').onclick=()=>go('home');
function sdk(){return new Promise((r,j)=>{if(window.kakao&&kakao.maps){kakao.maps.load(r);return}let k=window.HANKKI_CONFIG&&HANKKI_CONFIG.KAKAO_JS_KEY;if(!k)return j();let s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+k+'&libraries=services&autoload=false';s.onload=()=>kakao.maps.load(r);s.onerror=j;document.head.appendChild(s)})}async function ready(){await sdk();if(!ps){ps=new kakao.maps.services.Places();geo=new kakao.maps.services.Geocoder()}}
function D(a,b,c,d){let R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function render(){if(flt==='off'){let a=[];try{a=JSON.parse(localStorage.getItem('hankkiOffMap')||'[]')}catch(e){};$('cards').innerHTML=a.map(x=>`<div class=card><div class=pic>✨</div><div class=body><b>${x.name}</b><small>${x.price||'지도 밖 발견'}</small></div></div>`).join('')||'<div class=empty>아직 지도 밖 발견이 없어요.</div>';return}$('cards').innerHTML=places.slice(0,6).map((p,i)=>`<div class=card><div class=pic>${['🍲','🍝','☕'][i%3]}<span></span></div><div class=body><b>${p.place_name}</b><small>${p.d==null?'':Math.round(p.d)+'m'}${flt==='king'?' · 👑 킹성비 후보':''}</small></div></div>`).join('')||'<div class=empty>조건에 맞는 식당이 없어요.</div>'}
$('q').value='';setTimeout(()=>$('q').value='',200);$('q').onpointerdown=()=>{$('q').readOnly=false;if($('q').value.includes('@'))$('q').value=''};
$('gps').onclick=async()=>{try{await ready()}catch(e){alert('카카오 지도 설정을 확인해주세요.');return}navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;geo.coord2RegionCode(lng,lat,(a,st)=>{if(st===kakao.maps.services.Status.OK&&a.length)$('region').textContent='📍 '+(a.find(x=>x.region_type==='H')||a[0]).address_name});ps.categorySearch('FD6',(a,st)=>{if(st===kakao.maps.services.Status.OK){places=a.map(x=>({...x,d:D(lat,lng,+x.y,+x.x)}));render()}},{location:new kakao.maps.LatLng(lat,lng),radius:2000,sort:kakao.maps.services.SortBy.DISTANCE,size:15})})};
$('search').onclick=async()=>{let q=$('q').value.trim();if(!q)return;await ready();ps.keywordSearch(q,(a,st)=>{if(st===kakao.maps.services.Status.OK){places=a.map(x=>({...x,d:lat==null?null:D(lat,lng,+x.y,+x.x)}));render()}},{category_group_code:'FD6',size:15})};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('q').readOnly=false;$('q').value=b.dataset.q;$('search').click()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');flt=b.dataset.f;render()});$('king').onclick=$('kingCat').onclick=()=>{flt='king';render();$('cards').scrollIntoView({behavior:'smooth'})};
const Q=[['어디에서 드실 건가요?','area',['📍 현재 위치에서 찾기','🔎 다른 지역에서 찾기','🧳 여행 중이에요']],['몇 명이 함께 드시나요?','people',['👤 혼자','👫 2명','👨‍👩‍👧 3~4명','👥 5명 이상','👨‍👩‍👧‍👦 아이와 함께']],['함께 먹는 사람들의 연령대는요?','age',['10대','20대','30대','40대','50대','60대 이상','연령대가 다양해요']],['오늘은 어떤 기분이신가요?','mood',['😊 든든하게','🌿 가볍게','🔥 자극적으로','💕 분위기 있게','🌱 건강하게','🙂 아무거나']],['1인당 예산은 어느 정도인가요?','budget',['1만원 이하','1~2만원','2~3만원','3만원 이상','상관없어요']],['언제, 몇 끼를 추천해드릴까요?','meals',['🍚 지금 한 끼','🌅 아침+점심','☀️ 점심+저녁','📅 아침+점심+저녁']],['더 원하는 조건이 있나요?','extra',['👑 킹성비','🏠 로컬맛집','✨ 지도 밖 식당','🍱 점심특선','🔥 할인중','☕ 카페까지']]];let A={i:0,area:'현재 위치에서 찾기',people:'2명',age:'30대',mood:'든든하게',budget:'1~2만원',meals:'지금 한 끼',extra:'킹성비'};
function draw(){let x=Q[A.i];$('bar').style.width=((A.i+1)/7*100)+'%';$('question').innerHTML=`<div>${A.i+1}/7</div><h2>${x[0]}</h2><div class=opts>${x[2].map(v=>`<button class="${A[x[1]]===v.replace(/^[^ ]+ /,'')?'sel':''}" data-a="${v}">${v}</button>`).join('')}</div><div class=actions>${A.i?'<button id=prev>이전</button>':''}<button id=next class=next>${A.i===6?'추천받기 ✨':'다음'}</button></div>`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{A[x[1]]=b.dataset.a.replace(/^[^ ]+ /,'');draw()});if($('prev'))$('prev').onclick=()=>{A.i--;draw()};$('next').onclick=()=>{if(A.i<6){A.i++;draw()}else showResult()}}
function openAI(){go('aiMode')} $('aiStart').onclick=$('aiBtn').onclick=$('aiCat').onclick=openAI;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;A.i=0;if(mode==='오늘 하루'||mode==='여행지')A.meals='아침+점심+저녁';go('survey');draw()});$('surveyBack').onclick=()=>A.i? (A.i--,draw()):go('aiMode');$('resultBack').onclick=()=>{go('survey');draw()};
function showResult(){go('result');$('summary').innerHTML=`<div><b>🤖 ${mode} 맞춤 추천</b><small>${A.area} · ${A.people} · ${A.age} · ${A.mood} · ${A.budget}</small></div>`;$('results').innerHTML=places.length?places.slice(0,4).map((p,i)=>`<div class=resultCard><b>${['🌅 아침','☀️ 점심','🌙 저녁','☕ 선택'][i]} · ${p.place_name}</b><p>${p.road_address_name||p.address_name||''}</p><small>${p.d==null?'':Math.round(p.d)+'m'} · AI 맞춤 후보</small></div>`).join(''):'<div class=resultCard>먼저 홈에서 ‘내 주변 찾기’를 눌러 실제 식당을 불러와주세요.</div>'}
$('discover').onclick=()=>alert('발견하기: 지도에 있는 식당/지도 밖 식당 등록 기능은 다음 통합 단계에서 연결됩니다.');$('offCat').onclick=()=>{flt='off';render();$('cards').scrollIntoView({behavior:'smooth'})};
</script><script>
document.getElementById('pxAI').onclick=()=>{document.getElementById('aiMode').style.display='block';document.getElementById('home').style.display='none';document.querySelector('.nav').style.display='none'};
document.getElementById('pxKing').onclick=async()=>{try{if(!places.length)document.getElementById('gps').click();}catch(e){}};
document.getElementById('pxNear').onclick=()=>{document.getElementById('gps')?.click()};
document.getElementById('pxSearch').onclick=()=>{let i=document.getElementById('pxInput');i.style.display='block';i.focus()};
document.getElementById('pxInput').addEventListener('keydown',e=>{if(e.key==='Enter'){let old=document.getElementById('q');if(old){old.readOnly=false;old.value=e.target.value;document.getElementById('search')?.click()}}});
document.getElementById('pxDiscover').onclick=()=>alert('발견하기 기능은 기존 등록 화면과 연결하는 다음 단계에서 완성합니다.');
document.getElementById('pxOff').onclick=()=>alert('지도 밖 식당 등록 기능은 다음 단계에서 기존 핀 지정 화면과 연결합니다.');
document.getElementById('pxMy').onclick=()=>alert('마이/내 발견 관리 화면은 다음 단계에서 연결합니다.');
</script></body></html>
