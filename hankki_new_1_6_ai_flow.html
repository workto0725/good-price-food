const S=document.getElementById('screen'),T=document.getElementById('title'),B=document.getElementById('content'),ST=document.getElementById('status');function open(t){T.textContent=t;B.innerHTML='';ST.textContent='';S.style.display='block';document.body.style.overflow='hidden'}function close(){S.style.display='none';document.body.style.overflow=''}document.getElementById('back').onclick=close;function list(t){open(t);ST.textContent='NEW 1.0에서는 모든 버튼과 화면 전환을 먼저 안정적으로 확인합니다.';B.innerHTML=['해변식당','우리동네밥집','일광키친','바다마을식당'].map((x,i)=>'<div class="item" data-item="'+x+'"><b>'+x+'</b><div>부산 기장군 일광읍</div><small>'+(200+i*150)+'m</small></div>').join('');B.querySelectorAll('[data-item]').forEach(x=>x.onclick=()=>{open(x.dataset.item);B.innerHTML='<div class="item"><b>'+x.dataset.item+'</b><p>식당 상세 화면입니다.</p></div>'})}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>list(b.dataset.cat));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');list(b.dataset.filter)});document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{open(b.dataset.food);B.innerHTML='<div class="item"><b>'+b.dataset.food+'</b><p>식당 상세 화면입니다.</p></div>'});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let a=b.dataset.open;if(a==='near')list('📍 내 주변 식당');else if(a==='search'){open('🔎 검색');B.innerHTML='<input class="field" placeholder="식당, 메뉴, 지역 검색"><button class="mode">검색하기</button>'}else if(a==='location'){open('📍 지역 설정');B.innerHTML='<button class="mode">현재 위치 사용</button><input class="field" placeholder="지역 검색">'}else if(a==='notice'){open('🔔 알림');B.innerHTML='<div class="item">아직 새로운 알림이 없어요.</div>'}else if(a==='my'){open('마이');B.innerHTML='<div class="item">내 발견 · 찜 · 설정</div>'}else if(a==='ai'){open('🤖 AI 한끼');B.innerHTML='<button class="mode">🍚 지금 한 끼 추천</button><button class="mode">🍲 오늘 하루 식사 코스</button><button class="mode">🧳 여행지 먹거리 코스</button>'}else{open(b.textContent.trim());B.innerHTML='<div class="item">별도 화면으로 정상 전환되었습니다.</div>'}});
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let a=b.dataset.nav;if(a==='home'){close();scrollTo(0,0)}else if(a==='field')list('⌖ 현장발견');else if(a==='discover'){open('＋ 발견하기');B.innerHTML='<button class="mode">📍 지도에 있는 식당</button><button class="mode">✨ 지도에 없는 식당</button>'}else if(a==='map'){open('🗺️ 지도');B.innerHTML='<div class="item">지도 화면입니다.</div>'}else if(a==='my'){open('마이');B.innerHTML='<div class="item">내 발견 · 찜 · 설정</div>'}});
</script><script>

</script><script>
(function(){
const S=document.getElementById('screen'),T=document.getElementById('title'),B=document.getElementById('content'),ST=document.getElementById('status');
const Q=[['어디에서 드실 건가요?','area',['현재 위치','다른 지역','여행 중']],['몇 명이 함께 드시나요?','people',['혼자','2명','3~4명','5명 이상','아이와 함께']],['함께 먹는 사람들의 연령대는요?','age',['10대','20대','30대','40대','50대','60대 이상','연령대 다양']],['오늘 기분은 어떤가요?','mood',['든든하게','가볍게','자극적으로','분위기 있게','건강하게','아무거나']],['1인당 예산은요?','budget',['1만원 이하','1~2만원','2~3만원','3만원 이상','상관없음']],['몇 끼를 추천할까요?','meals',['지금 한 끼','아침+점심','점심+저녁','아침+점심+저녁']],['특별히 원하는 조건은요?','extra',['킹성비','로컬맛집','지도 밖 식당','점심특선','할인중','카페까지']]];
let A={mode:'지금 한 끼',i:0,area:'현재 위치',people:'2명',age:'30대',mood:'든든하게',budget:'1~2만원',meals:'지금 한 끼',extra:'킹성비'};
function show(t){T.textContent=t;ST.textContent='';B.innerHTML='';S.style.display='block';document.body.style.overflow='hidden'}
function menu(){show('🤖 AI 한끼');ST.textContent='오늘, 어떤 추천이 필요하세요?';B.innerHTML='<button class="mode aiMode" data-m="지금 한 끼">🍚 지금 한 끼 추천</button><button class="mode aiMode" data-m="오늘 하루">🍲 오늘 하루 식사 코스</button><button class="mode aiMode" data-m="여행지">🧳 여행지 먹거리 코스</button>';B.querySelectorAll('.aiMode').forEach(x=>x.onclick=()=>{A.mode=x.dataset.m;A.i=0;if(A.mode!=='지금 한 끼')A.meals='아침+점심+저녁';draw()})}
function draw(){let q=Q[A.i];T.textContent='🤖 AI 한끼';ST.innerHTML='<div class="aiProgress"><div style="width:'+((A.i+1)/Q.length*100)+'%"></div></div>';B.innerHTML='<h2>'+q[0]+'</h2><div class="aiChoices">'+q[2].map(v=>'<button class="aiChoice '+(A[q[1]]===v?'sel':'')+'" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="aiActions">'+(A.i?'<button id="aiPrev">이전</button>':'')+'<button id="aiNext" class="aiNext">'+(A.i===Q.length-1?'추천받기 ✨':'다음')+'</button></div>';B.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{A[q[1]]=x.dataset.v;draw()});let p=document.getElementById('aiPrev');if(p)p.onclick=()=>{A.i--;draw()};document.getElementById('aiNext').onclick=()=>{if(A.i<Q.length-1){A.i++;draw()}else result()}}
function result(){T.textContent='✨ AI 한끼 추천';ST.textContent=A.mode+' · '+A.area+' · '+A.people+' · '+A.age+' · '+A.budget;let L=A.meals.includes('아침')?['🌅 아침','☀️ 점심','🌙 저녁']:A.meals.includes('저녁')?['☀️ 점심','🌙 저녁','☕ 선택']:['🍚 지금 한 끼','🥢 다른 후보','☕ 선택'];B.innerHTML=L.map((x,i)=>'<div class="aiResult"><b>'+x+' · 추천 식당 '+(i+1)+'</b><div>'+A.mood+' · '+A.extra+' 조건 반영</div></div>').join('')+'<button class="mode" id="aiRestart">조건 다시 선택</button>';document.getElementById('aiRestart').onclick=menu}
document.querySelectorAll('[data-open="ai"]').forEach(x=>x.onclick=menu);
})();
</script></body></html>
