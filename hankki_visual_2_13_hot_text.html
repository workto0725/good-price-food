</div></section><script>
(function(){
 const ob=document.getElementById("onboarding26");
 const slides=[...document.querySelectorAll(".ob26slide")];
 let i=0;
 function paint(){slides.forEach((x,n)=>x.classList.toggle("active",n===i))}
 function close(){ob.style.display="none";sessionStorage.setItem("hankkiOnboard26","1")}
 document.getElementById("ob26skip").onclick=close;
 document.getElementById("ob26next").onclick=()=>{if(i<slides.length-1){i++;paint()}else close()};
 paint();
 if(sessionStorage.getItem("hankkiOnboard26")) ob.style.display="none";
})();
</script><script>
(function(){
 const bar=document.querySelector(".filters");
 if(!bar)return;
 const buttons=[...bar.querySelectorAll("[data-filter]")];
 const cards=[...document.querySelectorAll(".cards .card")];
 buttons.forEach(btn=>btn.addEventListener("click",function(){
   bar.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
   btn.classList.add("on");
   const mode=btn.dataset.filter;
   cards.forEach(c=>c.style.display="");
   if(mode==="popular"){ cards.slice().reverse().forEach(c=>c.parentElement.appendChild(c)); }
   if(mode==="new"){ if(cards[2]) cards[2].parentElement.prepend(cards[2]); }
   if(mode==="sale"){ cards.forEach((c,i)=>c.style.display=i===0?"":"none"); }
   if(mode==="near"){ cards.forEach(c=>c.parentElement.appendChild(c)); }
 }));
})();
</script></body></html>
