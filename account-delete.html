<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한끼일기+ 계정 삭제</title><style>body{max-width:480px;margin:40px auto;padding:24px;background:#fffdf9;color:#443a32;font:16px/1.8 system-ui}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #dfd7ce;border-radius:8px;font:inherit}button{background:#805c43;color:white}label{display:block}input[type=checkbox]{width:auto}</style></head><body><h1>한끼일기+ 계정 삭제</h1><p>로그인하여 본인의 계정 삭제를 요청하세요. 계정과 작성한 추천 글·저장·신고 내역이 삭제되며 복구할 수 없습니다. 기기에만 저장된 개인 한끼 기록은 유지됩니다.</p><form id="form"><label>가입 이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><label><input id="confirm" type="checkbox" required>삭제 범위와 복구 불가 안내를 확인했습니다.</label><button id="submit" type="submit">내 계정 삭제 요청</button></form><p role="status" id="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script>
const client=supabase.createClient('https://vetskedrqklascrhhiux.supabase.co','sb_publishable_ZzAuDK9uOIyuKvaZZA3ZYA_7girPdrC',{auth:{persistSession:false,autoRefreshToken:false}});
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');if(!document.getElementById('confirm').checked)return;button.disabled=true;status.textContent='본인 확인 후 삭제하고 있습니다…';try{const login=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('password').value='';if(login.error)throw new Error('LOGIN');const result=await client.functions.invoke('delete-account',{body:{confirm:'DELETE_MY_ACCOUNT'}});if(result.error||!result.data||!result.data.deleted)throw new Error('DELETE');document.getElementById('form').hidden=true;status.textContent='계정과 관련 커뮤니티 데이터를 삭제했습니다.'}catch(error){status.textContent=error.message==='LOGIN'?'이메일·비밀번호와 이메일 인증 상태를 확인해주세요.':'삭제를 완료하지 못했습니다. 잠시 후 다시 시도해주세요.'}finally{await client.auth.signOut();button.disabled=false}});
</script></body></html>
