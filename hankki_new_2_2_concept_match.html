async function nearK(t='내 주변 식당'){openK(t);ST.textContent='현재 위치를 확인하고 있어요.';try{let[a,b]=await locateK();Kps.categorySearch('FD6',(r,st)=>{if(st===kakao.maps.services.Status.OK){let z=r.map(x=>({...x,_d:d(a,b,+x.y,+x.x)}));ST.textContent='현재 위치에서 가까운 식당이에요.';rows(z)}else ST.textContent='주변 식당을 찾지 못했어요.'},{location:new kakao.maps.LatLng(a,b),radius:2000,sort:kakao.maps.services.SortBy.DISTANCE,size:15})}catch(e){ST.textContent='위치 권한 또는 카카오 지도 설정을 확인해주세요.'}}
async function catK(t,q){openK(t);ST.textContent='식당을 찾고 있어요.';try{let[a,b]=await locateK();Kps.keywordSearch(q,(r,st)=>{if(st===kakao.maps.services.Status.OK){let z=r.map(x=>({...x,_d:d(a,b,+x.y,+x.x)})).sort((x,y)=>x._d-y._d);ST.textContent='현재 위치에서 가까운 결과예요.';rows(z)}else ST.textContent='검색 결과가 없어요.'},{location:new kakao.maps.LatLng(a,b),radius:5000,size:15})}catch(e){ST.textContent='위치 권한 또는 카카오 지도 설정을 확인해주세요.'}}
async function mapK(f){openK('지도');B.innerHTML='<div id="kmap" class="realMap"></div>';try{let[a,b]=await locateK();let center=f?new kakao.maps.LatLng(+f.y,+f.x):new kakao.maps.LatLng(a,b);let m=new kakao.maps.Map(document.getElementById('kmap'),{center,level:4});new kakao.maps.Marker({map:m,position:new kakao.maps.LatLng(a,b),title:'현재 위치'});(f?[f]:Kplaces).forEach(x=>new kakao.maps.Marker({map:m,position:new kakao.maps.LatLng(+x.y,+x.x),title:x.place_name}))}catch(e){ST.textContent='지도를 불러오지 못했어요.'}}
document.querySelectorAll('.cat[data-cat]').forEach(x=>x.onclick=()=>catK(x.dataset.cat,x.dataset.cat==='고기/구이'?'고기':x.dataset.cat.replace('/디저트','')));
document.querySelector('.near button').onclick=()=>nearK();
document.querySelector('[data-nav="field"]').onclick=()=>nearK('현장발견');
document.querySelector('[data-nav="map"]').onclick=()=>mapK();
document.querySelector('.hybridKing').onclick=()=>catK('킹성비','맛집');
})();
</script><script>
(function(){
const S=document.getElementById('screen'),T=document.getElementById('title'),B=document.getElementById('content'),ST=document.getElementById('status');

function show(t){T.textContent=t;ST.textContent='';B.innerHTML='';S.style.display='block';document.body.style.overflow='hidden'}
function menu(){show('AI 한끼');ST.textContent='오늘, 어떤 추천이 필요하세요?';B.innerHTML='<button class="mode aiM" data-m="지금 한 끼">지금 한 끼 추천</button><button class="mode aiM" data-m="오늘 하루">오늘 하루 식사 코스</button><button class="mode aiM" data-m="여행지">여행지 먹거리 코스</button>';B.querySelectorAll('.aiM').forEach(x=>x.onclick=()=>{A.mode=x.dataset.m;if(A.mode!=='지금 한 끼')A.meals='아침+점심+저녁';areaStep()})}
function areaStep(){show('어디에서 드실 건가요?');B.innerHTML='<button class="mode area" data-a="현재 위치">현재 위치에서 찾기</button><button class="mode area" data-a="다른 지역">다른 지역에서 찾기</button><button class="mode area" data-a="여행 중">여행 중이에요</button><div id="placeBox"></div>';B.querySelectorAll('.area').forEach(x=>x.onclick=()=>{A.area=x.dataset.a;if(A.area==='현재 위치'){A.placeName='현재 위치';A.i=0;draw()}else placeInput(A.area==='여행 중')})}
function placeInput(trip){let box=document.getElementById('placeBox');box.innerHTML='<div class="placeSearchBox"><b>'+(trip?'여행지는 어디인가요?':'어느 지역에서 찾을까요?')+'</b>'+(trip?'<div class="tripQuick"><button data-h="숙소 주변">숙소 주변</button><button data-h="관광지 주변">관광지 주변</button><button data-h="역·터미널 주변">역·터미널 주변</button><button data-h="직접 검색">직접 검색</button></div>':'')+'<input id="placeQ" class="field" placeholder="예: 대구 동성로, 경주 황리단길"><button id="placeGo" class="mode">장소 검색</button><div id="placeResults" class="placeResults"></div></div>';document.getElementById('placeGo').onclick=searchPlace}
async function searchPlace(){let q=document.getElementById('placeQ').value.trim();if(!q)return;let out=document.getElementById('placeResults');out.innerHTML='검색 중…';try{await readyK();Kps.keywordSearch(q,(r,st)=>{if(st===kakao.maps.services.Status.OK){out.innerHTML=r.slice(0,8).map((x,i)=>'<button data-p="'+i+'"><b>'+x.place_name+'</b><br><small>'+(x.road_address_name||x.address_name||'')+'</small></button>').join('');out.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>{let x=r[+el.dataset.p];A.placeName=x.place_name;A.placeLat=+x.y;A.placeLng=+x.x;A.i=0;draw()})}else out.innerHTML='검색 결과가 없어요.'})}catch(e){out.innerHTML='카카오 장소검색 연결을 확인해주세요.'}}
function draw(){let q=Q[A.i];show('AI 한끼');ST.innerHTML='<div class="aiProgress"><div style="width:'+((A.i+1)/Q.length*100)+'%"></div></div>';B.innerHTML='<h2>'+q[0]+'</h2><div class="aiChoices">'+q[2].map(v=>'<button class="aiChoice '+(A[q[1]]===v?'sel':'')+'" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="aiActions">'+(A.i?'<button id="aiPrev">이전</button>':'')+'<button id="aiNext" class="aiNext">'+(A.i===Q.length-1?'추천받기':'다음')+'</button></div>';B.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{A[q[1]]=x.dataset.v;draw()});let p=document.getElementById('aiPrev');if(p)p.onclick=()=>{A.i--;draw()};document.getElementById('aiNext').onclick=()=>{if(A.i<Q.length-1){A.i++;draw()}else result()}}
function result(){show('AI 한끼 추천');ST.textContent=(A.placeName||A.area)+' · '+A.people+' · '+A.age+' · '+A.budget;B.innerHTML='<div class="aiResult"><b>추천 지역</b><div>'+(A.placeName||A.area)+'</div></div><div class="aiResult"><b>선택 조건</b><div>'+A.mood+' · '+A.extra+' · '+A.meals+'</div></div><button class="mode" id="again">조건 다시 선택</button>';document.getElementById('again').onclick=menu}
document.querySelectorAll('[data-open="ai"]').forEach(x=>x.onclick=menu);
})();
