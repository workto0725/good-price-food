<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한끼일기+ 지도 연결</title>
<style>html,body,#map{height:100%;margin:0}body{background:#faf7f2;font-family:system-ui}.pin{border:0;background:#8c654b;color:white;border-radius:20px;padding:9px;cursor:pointer}.pin.love{background:#d26768}.pin.bad{background:#8493a1}.pin i{font-size:10px}</style></head><body><div id="map"></div><script src="config.js"></script><script>
(function(){
  'use strict';var channel='hankki-native-map-v1',map=null,pins={},parentOrigin=null,allowed=['https://localhost','http://localhost','capacitor://localhost'];
  function send(message){if(parentOrigin)parent.postMessage(Object.assign({channel:channel},message),parentOrigin)}
  var ready=new Promise(function(resolve,reject){var key=(window.APP_CONFIG||{}).KAKAO_JS_KEY;if(!key){reject(new Error('지도 키 설정이 필요해요.'));return}var script=document.createElement('script');script.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(key)+'&libraries=services&autoload=false';script.onload=function(){if(!window.kakao||!kakao.maps){reject(new Error('지도를 불러오지 못했어요.'));return}kakao.maps.load(resolve)};script.onerror=function(){reject(new Error('지도 연결에 실패했어요.'))};document.head.appendChild(script)});
  ready.catch(function(error){document.getElementById('map').textContent=error.message;send({type:'failed',error:error.message})});
  function point(p){if(!p||!Number.isFinite(Number(p.lat))||!Number.isFinite(Number(p.lng)))throw new Error('좌표를 확인해주세요.');return new kakao.maps.LatLng(Number(p.lat),Number(p.lng))}
  async function run(action,data){await ready;var k=kakao.maps,d=data||{};
    if(action==='search')return new Promise(function(resolve){var options=Object.assign({},d.options),callback=function(rows,status,page){resolve({rows:rows,status:status,more:!!(page&&page.hasNextPage)})};if(options.location)options.location=point(options.location);if(options.sort==='distance')options.sort=k.services.SortBy.DISTANCE;var places=new k.services.Places();if(d.kind==='keyword')places.keywordSearch(String(d.query).slice(0,100),callback,options);else if(d.kind==='category'&&['FD6','CE7'].indexOf(d.query)>=0)places.categorySearch(d.query,callback,options);else resolve({rows:[],status:'ERROR',more:false})});
    if(action==='address')return new Promise(function(resolve){new k.services.Geocoder().addressSearch(String(d.query).slice(0,150),function(rows,status){resolve({rows:rows,status:status})})});
    if(action==='map-init'){if(!map){map=new k.Map(document.getElementById('map'),{center:point(d.center),level:d.level||6});k.event.addListener(map,'click',function(){send({type:'map-click'})})}return true}
    if(!map)return false;
    if(action==='map-relayout')map.relayout();else if(action==='map-center')map.setCenter(point(d));else if(action==='map-pan')map.panTo(point(d));else if(action==='map-level')map.setLevel(Number(data));else if(action==='map-bounds'){var bounds=new k.LatLngBounds();data.forEach(function(p){bounds.extend(point(p))});map.setBounds(bounds)}
    else if(action==='pin-remove'){if(pins[d.id])pins[d.id].setMap(null);delete pins[d.id]}
    else if(action==='pin-add'){var template=document.createElement('template');template.innerHTML=String(d.html||'');var content=template.content.firstElementChild;if(!content||!['BUTTON','DIV'].includes(content.tagName))throw new Error('Invalid marker');content.querySelectorAll('script,iframe,object,embed,img,svg,a,style').forEach(function(e){e.remove()});[content].concat(Array.from(content.querySelectorAll('*'))).forEach(function(e){Array.from(e.attributes).forEach(function(a){if(!['class','style','type','aria-label'].includes(a.name))e.removeAttribute(a.name)})});content.addEventListener('click',function(event){event.stopPropagation();send({type:'pin-click',id:d.id})});if(pins[d.id])pins[d.id].setMap(null);pins[d.id]=new k.CustomOverlay({position:point(d.position),content:content,yAnchor:d.yAnchor});pins[d.id].setMap(map)}return true;
  }
  window.addEventListener('message',function(event){if(event.source!==parent||allowed.indexOf(event.origin)<0||!event.data||event.data.channel!==channel)return;parentOrigin=event.origin;var m=event.data;if(m.type==='hello'){ready.then(function(){send({type:'ready'})},function(e){send({type:'failed',error:e.message})});return}if(m.type!=='request'||typeof m.id!=='string')return;run(m.action,m.data).then(function(result){send({type:'result',id:m.id,result:result})},function(error){send({type:'result',id:m.id,error:error.message})})});
  if(parent===window)run('map-init',{center:{lat:35.267,lng:129.233},level:6}).catch(function(){});
})();
</script></body></html>
