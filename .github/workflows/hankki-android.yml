name: Build Hankki Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'hankki-plus-app-project.zip'
      - '.github/workflows/hankki-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract app source
        run: unzip -q hankki-plus-app-project.zip
      - name: Install dependencies
        working-directory: hankki-plus-app
        run: npm ci
      - name: Build and sync Android
        working-directory: hankki-plus-app
        run: |
          npm run build
          npx cap sync android
          python3 scripts/configure-native.py
          npm test
          node scripts/test-edge.cjs
      - name: Compile APK
        working-directory: hankki-plus-app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: hankki-plus-android-test-apk
          path: hankki-plus-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
