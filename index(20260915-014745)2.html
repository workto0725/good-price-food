<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b35"><title>착한한끼</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;background:#f7f7f5;color:#1f2328}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#fff7f1,#fff 55%,#f3f7f2)}.loginBox{width:min(430px,100%)}.logo{width:64px;height:64px;border-radius:20px;background:#ff6b35;display:grid;place-items:center;font-size:32px;box-shadow:0 12px 30px #ff6b3533}.login h1{font-size:38px;margin:18px 0 6px}.muted{color:#747b83}.card{background:white;border:1px solid #ecece8;border-radius:24px;padding:20px;box-shadow:0 10px 30px #0000000a}.field{width:100%;padding:15px 16px;border:1px solid #deded8;border-radius:14px;margin:6px 0 12px;outline:none}.field:focus{border-color:#ff6b35;box-shadow:0 0 0 3px #ff6b3518}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#ff6b35;color:white;font-weight:800;cursor:pointer}.demo{font-size:12px;text-align:center;margin-top:12px;color:#92979d}.app{min-height:100vh}.top{position:sticky;top:0;z-index:500;background:#ffffffee;backdrop-filter:blur(16px);border-bottom:1px solid #ecece8}.topin{max-width:1200px;margin:auto;padding:14px 18px}.brandrow{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900}.area{font-size:13px;color:#697078;margin-top:2px}.logout{border:0;background:#f2f2ef;border-radius:12px;padding:9px 12px}.search{display:flex;gap:8px;margin-top:12px}.search input{flex:1;padding:13px 15px;border:1px solid #e2e2dd;border-radius:14px;background:#fafafa}.loc{border:0;border-radius:14px;padding:0 15px;background:#1f2328;color:#fff;font-weight:700}.chips{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #e0e0db;background:white;border-radius:999px;padding:8px 13px}.chip.active{background:#fff0e9;color:#e9531d;border-color:#ffd0bd;font-weight:800}.layout{max-width:1200px;margin:auto;padding:16px 18px;display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.mapbox{height:calc(100vh - 180px);min-height:520px;border-radius:24px;overflow:hidden;position:sticky;top:165px;border:1px solid #e6e6e1;background:#eee}.map{height:100%}.status{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:450;background:#20242bdd;color:#fff;padding:9px 13px;border-radius:999px;font-size:13px}.listhead{display:flex;justify-content:space-between;align-items:center;margin:3px 0 12px}.listhead strong{font-size:19px}.listhead select{border:0;background:#eeeef0;padding:8px 10px;border-radius:10px}.restaurant{background:#fff;border:1px solid #e9e9e4;border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer;box-shadow:0 4px 15px #00000008}.rTop{display:flex;justify-content:space-between;gap:10px}.rName{font-size:18px;font-weight:900}.score{background:#fff2e9;color:#e95d25;border-radius:10px;padding:5px 8px;font-weight:900;font-size:13px}.meta{color:#70767d;font-size:13px;margin-top:6px}.price{font-weight:850;margin-top:10px}.empty{background:white;border:1px dashed #d8d8d2;border-radius:20px;padding:30px;text-align:center;color:#747b83}.sheet{position:fixed;inset:0;z-index:1000}.back{position:absolute;inset:0;background:#0008}.panel{position:absolute;right:0;top:0;height:100%;width:min(470px,100%);background:#fff;padding:26px;overflow:auto}.close{float:right;border:0;background:#f1f1ee;width:38px;height:38px;border-radius:50%}.detail h2{font-size:28px;margin:44px 0 6px}.info{padding:14px 0;border-bottom:1px solid #eee}.tag{display:inline-block;background:#f3f3ef;border-radius:999px;padding:6px 10px;margin:4px 4px 0 0;font-size:13px}.leaflet-control-attribution{font-size:9px!important}@media(max-width:760px){.layout{display:flex;flex-direction:column;padding:10px}.mapbox{position:relative;top:auto;height:42vh;min-height:310px;border-radius:20px}.topin{padding:12px}.panel{top:auto;bottom:0;height:min(78vh,700px);width:100%;border-radius:26px 26px 0 0}.login h1{font-size:34px}.loc{padding:0 12px}.restaurant{border-radius:17px}}
</style></head><body>
<section id="login" class="login"><div class="loginBox"><div class="logo">🍚</div><h1>착한한끼</h1><p class="muted">내 주변에서 가격 좋고 만족도 높은 한 끼를 찾아보세요.</p><div class="card"><input id="email" class="field" type="email" placeholder="이메일"><input id="pw" class="field" type="password" placeholder="비밀번호 (4자 이상)"><button id="loginBtn" class="primary">시작하기</button><div class="demo">현재 버전은 서비스 화면 테스트용 로그인입니다.</div></div></div></section>
<section id="main" class="app hidden"><header class="top"><div class="topin"><div class="brandrow"><div><div class="brand">🍚 착한한끼</div><div id="area" class="area">내 주변 가성비 식당</div></div><button id="logout" class="logout">로그아웃</button></div><div class="search"><input id="q" placeholder="식당명 또는 메뉴 검색"><button id="locate" class="loc">📍 내 위치</button></div><div class="chips"><button class="chip active" data-f="all">전체</button><button class="chip" data-f="cheap">1만원 이하</button><button class="chip" data-f="korean">한식</button><button class="chip" data-f="cafe">카페</button><button class="chip" data-f="saved">♡ 찜</button></div></div></header><main class="layout"><div class="mapbox"><div id="map" class="map"></div><div id="status" class="status">내 위치를 확인해 주세요</div></div><div><div class="listhead"><strong id="count">주변 식당</strong><select id="sort"><option value="distance">거리순</option><option value="rating">가성비순</option></select></div><div id="list"></div></div></main></section>
<div id="sheet" class="sheet hidden"><div id="back" class="back"></div><div class="panel"><button id="close" class="close">✕</button><div id="detail" class="detail"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=s=>document.querySelector(s);let map,markers=[],places=[],filter='all',saved=JSON.parse(localStorage.getItem('savedFood')||'[]');
function login(){if(!$('#email').value.includes('@')||$('#pw').value.length<4){alert('이메일과 4자리 이상의 비밀번호를 입력해 주세요.');return}localStorage.setItem('foodLogin','1');showMain()}
function showMain(){ $('#login').classList.add('hidden');$('#main').classList.remove('hidden'); if(!map){map=L.map('map').setView([35.1796,129.0756],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)} setTimeout(()=>map.invalidateSize(),100);locate()}
async function locate(){const st=$('#status');st.textContent='현재 위치를 확인하는 중…';if(!navigator.geolocation){st.textContent='이 기기에서는 위치 기능을 사용할 수 없습니다.';return}navigator.geolocation.getCurrentPosition(async p=>{let lat=p.coords.latitude,lon=p.coords.longitude;map.setView([lat,lon],15);L.circleMarker([lat,lon],{radius:8}).addTo(map).bindPopup('내 위치');st.textContent='주변 식당을 찾는 중…';await loadPlaces(lat,lon)},()=>{st.textContent='위치 권한을 허용하면 주변 식당을 볼 수 있어요.'},{enableHighAccuracy:true,timeout:10000})}
async function loadPlaces(lat,lon){try{let query=`[out:json][timeout:20];(node[amenity~"restaurant|fast_food|cafe"](around:1800,${lat},${lon});way[amenity~"restaurant|fast_food|cafe"](around:1800,${lat},${lon}););out center tags 50;`;let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});let d=await r.json();places=d.elements.map((x,i)=>{let t=x.tags||{},la=x.lat||x.center?.lat,lo=x.lon||x.center?.lon;if(!la||!lo)return null;let dist=Math.round(distance(lat,lon,la,lo));let cuisine=t.cuisine||'',cat=t.amenity==='cafe'?'카페':cuisine.includes('korean')?'한식':'음식점';return{id:x.id,name:t.name||t['name:ko']||'이름 미등록 식당',lat:la,lon:lo,distance:dist,category:cat,address:[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ')||'주소 정보 확인 필요',hours:t.opening_hours||'영업시간 정보 확인 필요',phone:t.phone||t['contact:phone']||'전화번호 정보 없음',price:null,rating:(4+(i%9)/10).toFixed(1)}}).filter(Boolean).sort((a,b)=>a.distance-b.distance);render();$('#status').textContent=places.length?`반경 1.8km 식당 ${places.length}곳`:'주변 식당 정보가 없습니다.'}catch(e){$('#status').textContent='식당 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';render()}}
function distance(a,b,c,d){let R=6371e3,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];let q=$('#q').value.trim().toLowerCase(),arr=places.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(filter==='all'||filter==='korean'&&p.category==='한식'||filter==='cafe'&&p.category==='카페'||filter==='saved'&&saved.includes(p.id)||filter==='cheap'&&p.price&&p.price<=10000));if($('#sort').value==='rating')arr.sort((a,b)=>b.rating-a.rating);else arr.sort((a,b)=>a.distance-b.distance);$('#count').textContent=`식당 ${arr.length}곳`;$('#list').innerHTML=arr.length?arr.map(p=>`<div class="restaurant" data-id="${p.id}"><div class="rTop"><div class="rName">${esc(p.name)}</div><span class="score">가성비 ${p.rating}</span></div><div class="meta">${p.category} · ${p.distance<1000?p.distance+'m':(p.distance/1000).toFixed(1)+'km'}</div><div class="price">${p.price?p.price.toLocaleString()+'원':'메뉴 가격 정보 수집 중'}</div></div>`).join(''):`<div class="empty">조건에 맞는 식당이 없어요.<br>다른 필터로 찾아보세요.</div>`;arr.forEach(p=>{let m=L.marker([p.lat,p.lon]).addTo(map).bindTooltip(p.name);m.on('click',()=>openDetail(p));markers.push(m)});document.querySelectorAll('.restaurant').forEach(el=>el.onclick=()=>openDetail(places.find(p=>String(p.id)===el.dataset.id)))}
function openDetail(p){let is=saved.includes(p.id);$('#detail').innerHTML=`<h2>${esc(p.name)}</h2><div><span class="tag">${p.category}</span><span class="tag">가성비 ${p.rating}</span><span class="tag">${p.distance}m</span></div><div class="info"><b>대표 가격</b><br>${p.price?p.price.toLocaleString()+'원':'아직 등록된 메뉴 가격이 없어요.'}</div><div class="info"><b>영업시간</b><br>${esc(p.hours)}</div><div class="info"><b>주소</b><br>${esc(p.address)}</div><div class="info"><b>전화</b><br>${esc(p.phone)}</div><br><button id="saveBtn" class="primary">${is?'♥ 찜 해제':'♡ 찜하기'}</button><p class="muted" style="font-size:12px">현재 식당 기본 정보는 공개 지도 데이터를 활용한 테스트 버전입니다. 가격·휴무일·가성비 평가는 사용자 제보 기능과 자체 DB를 연결해 정확도를 높일 예정입니다.</p>`;$('#sheet').classList.remove('hidden');$('#saveBtn').onclick=()=>{saved=is?saved.filter(x=>x!==p.id):[...saved,p.id];localStorage.setItem('savedFood',JSON.stringify(saved));openDetail(p);render()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#loginBtn').onclick=login;$('#locate').onclick=locate;$('#logout').onclick=()=>{localStorage.removeItem('foodLogin');location.reload()};$('#q').oninput=render;$('#sort').onchange=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});$('#close').onclick=$('#back').onclick=()=>$('#sheet').classList.add('hidden');if(localStorage.getItem('foodLogin'))showMain();
</script></body></html>
